[package]
name = "sheets-monitor"
version = "0.1.0"
description = "Sheets Monitor — integrações Google de leitura"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[[bin]]
name = "sheets-monitor"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "native_probe"
path = "examples/native_probe.rs"
required-features = ["desktop", "native-probe"]

[lib]
name = "sheets_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-notification", "dep:tauri-plugin-single-instance", "dep:winreg"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
native-probe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
base64 = "0.22"
url = "2"
keyring = { version = "3", features = ["windows-native"] }
open = "5"
zeroize = { version = "1", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-javascript = "0.25.0"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-notification = { version = "=2.8.0", optional = true }
tauri-plugin-single-instance = { version = "=2.5.5", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", optional = true }

[dev-dependencies]
tempfile = "3"

