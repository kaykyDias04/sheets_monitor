[package]
name = "sheets-monitor"
version = "0.1.0"
description = "Fundação desktop do Sheets Monitor — Sprint 01"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "sheets-monitor"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
name = "sheets_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2", features = [], optional = true }

[dev-dependencies]
tempfile = "3"

