name: Sprint 04 - Windows integrity engine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-repository.mjs
      - run: ./scripts/check-rust.ps1 -Task format-check
      - run: ./scripts/check-rust.ps1 -Task test
      - run: ./scripts/check-rust.ps1 -Task clippy
      - run: ./scripts/check-rust.ps1 -Task build
